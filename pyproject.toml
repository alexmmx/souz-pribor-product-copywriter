[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "souz-pribor-product-copywriter"
version = "0.1.0"
description = "LLM-assisted B2B product card drafts grounded in source data"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.0,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
product-copywriter = "product_copywriter.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/product_copywriter"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
